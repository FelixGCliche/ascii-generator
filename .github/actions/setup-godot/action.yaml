name: Setup Godot
description: Installs Godot (version pinned in mise.toml) and matching export templates
outputs:
  godot-version:
    description: Resolved Godot version (e.g. '4.7.2-stable')
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@v4
      with:
        install: true
        cache: true

    - name: Resolve Godot version
      id: version
      shell: bash
      run: |
        VERSION=$(mise current godot)   # e.g. 4.7.2-stable
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "templates-dir=${HOME}/.local/share/godot/export_templates/${VERSION/-/.}" >> "$GITHUB_OUTPUT"
        echo "Using Godot ${VERSION}"

    # Restore/save split: save right after install, so templates overwritten later in the
    # job (e.g. by build-web-template) never end up in this cache.
    - name: Restore export templates
      id: cache-templates
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.version.outputs.templates-dir }}
        key: godot-export-templates-${{ steps.version.outputs.version }}

    - name: Install export templates
      if: steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        TEMPLATES_DIR: ${{ steps.version.outputs.templates-dir }}
      run: |
        TMP=$(mktemp -d)
        curl -fsSL "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz" -o "${TMP}/templates.tpz"
        unzip -q "${TMP}/templates.tpz" -d "${TMP}"
        mkdir -p "${TEMPLATES_DIR}"
        mv "${TMP}"/templates/* "${TEMPLATES_DIR}/"
        rm -rf "${TMP}"

    - name: Save export templates
      if: steps.cache-templates.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.version.outputs.templates-dir }}
        key: godot-export-templates-${{ steps.version.outputs.version }}

    - name: Run gd-plug
      shell: bash
      run: |
        godot --headless --import   # registers gd-plug's classes on a fresh checkout
        godot --headless -s plug.gd install

    - name: Reimport project assets
      shell: bash
      run: |
        godot --headless --import

name: Build & Deploy

on: 
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Run GdLint
        run: gdlint ./
      - name: Run GdFormat
        run: gdformat ./ -s 2 -d
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup Godot
        uses: ./.github/actions/setup-godot
      - name: Run GUT
        run: godot --headless -s addons/gut/gut_cmdln.gd -gexit

  export:
    name: Export for ${{ matrix.targetPlatform.name }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [
          { name: win64, path: build.exe },
          { name: html5, path: index.html }
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup Godot
        id: godot
        uses: ./.github/actions/setup-godot
      - name: Build web export template
        if: matrix.targetPlatform.name == 'html5'
        uses: ./.github/actions/build-web-template
        with:
          godot-version: ${{ steps.godot.outputs.godot-version }}
      - name: Export Godot project
        run: |
          mkdir -vp build-${{ matrix.targetPlatform.name }}
          godot --headless --export-release ${{ matrix.targetPlatform.name }} build-${{ matrix.targetPlatform.name }}/${{ matrix.targetPlatform.path }}
      - name: Generate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.targetPlatform.name }}
          path: build-${{ matrix.targetPlatform.name }}
          retention-days: 1
 
  deploy:
    name: Deploy preview on Cloudflare Pages
    needs: export
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      MAX_FILE_SIZE_MIB: 25   # Cloudflare Pages per-file limit
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Download export artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-html5
          path: build-html5
      - name: Add headers
        run: cp deploy/_headers build-html5/_headers
      - name: Check file sizes
        run: |
          big=$(find build-html5 -type f -size +$((MAX_FILE_SIZE_MIB * 1024 * 1024))c -exec ls -l {} +)
          if [ -n "$big" ]; then
            echo "::error::Files larger than ${MAX_FILE_SIZE_MIB} MiB (Cloudflare Pages limit):"
            echo "$big"
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        run: 

name: Build & Deploy

on: 
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  packages: read
  id-token: write

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      
      - name: Run GdLint
        run: gdlint ./
      
      - name: Run GdFormat
        run: gdformat ./ -s 2 -d
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup Godot
        uses: ./.github/actions/setup-godot
      - name: Run GUT
        run: godot --headless -s addons/gut/gut_cmdln.gd -gexit

  export:
    name: Export for ${{ matrix.targetPlatform.name }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [
          { name: win64, path: build.exe },
          { name: html5, path: index.html }
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup Godot
        uses: ./.github/actions/setup-godot
      - name: Export Godot project
        run: |
          mkdir -vp build-${{ matrix.targetPlatform.name }}
          godot --headless --export-release ${{ matrix.targetPlatform.name }} build-${{ matrix.targetPlatform.name }}/${{ matrix.targetPlatform.path }}
      - name: Generate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.targetPlatform.name }}
          path: build-${{ matrix.targetPlatform.name }}
          retention-days: 1
 
  deploy:
    name: Deploy on Github Pages
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      packages: read
      id-token: write
    steps: 
      - name: Download export artifacts
        uses: actions/download-artifact@v7
        with: 
          name: build-html5
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
